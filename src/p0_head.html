<style>
/* Layout: sidebar + content grid, dark arcade-dashboard with championship-gold accent; sidebar becomes a scrolling tab strip on phones */
:root{
  color-scheme:dark;
  --bg:#09090c; --panel:#131316; --panel2:#1b1b20; --line:#2e2e36;
  --fg:#f2f2f4; --mute:#a0a1ad; --gold:#e5322d; --gold-ink:#fff; --star:#f4c24a; --silver:#c9ccd6;
  --teal:#3cc4b1; --red:#ff7a6e; --blue:#7aa2ff; --shadow:0 8px 24px rgba(0,0,0,.35);
  --sb-fg:#f2f2f4; --sb-mute:#a0a1ad; --sb-line:#2e2e36; --sb-panel:#131316; --sb-panel2:#1b1b20; --sb-gold:#e5322d; --sb-bg:transparent; --sb-m:0px; --sb-pad:0px; --sb-glow:transparent; --card-sh:none; --hi:#fff; --glow:color-mix(in srgb,#e5322d 14%,transparent);
  --font-d:'Russo One',Impact,'Arial Black',sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-px:'Press Start 2P','Courier New',monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#efe9df; --panel:#fffdf8; --panel2:#f6f0e5; --line:#ddd3c2;
  --fg:#1c1814; --mute:#6a6054; --gold:#c8102e; --gold-ink:#fff; --star:#a86d00; --silver:#7c808c;
  --teal:#0f8374; --red:#c4342d; --blue:#2a58c4; --shadow:0 6px 18px rgba(60,40,20,.14);
  --sb-bg:#e5dccb; --sb-m:10px; --sb-pad:12px; --sb-glow:color-mix(in srgb,#c8102e 8%,transparent); --sb-fg:#16161c; --sb-mute:#3d3d46; --sb-line:#cfc2aa; --sb-panel:#f1eadc; --sb-panel2:#ebe2d1; --sb-gold:#c8102e; --card-sh:0 1px 0 #fff inset,0 2px 8px rgba(70,50,25,.08); --hi:#fff; --glow:color-mix(in srgb,#c8102e 9%,transparent);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#efe9df; --panel:#fffdf8; --panel2:#f6f0e5; --line:#ddd3c2;
  --fg:#1c1814; --mute:#6a6054; --gold:#c8102e; --gold-ink:#fff; --star:#a86d00; --silver:#7c808c;
  --teal:#0f8374; --red:#c4342d; --blue:#2a58c4; --shadow:0 6px 18px rgba(60,40,20,.14);
  --sb-bg:#e5dccb; --sb-m:10px; --sb-pad:12px; --sb-glow:color-mix(in srgb,#c8102e 8%,transparent); --sb-fg:#16161c; --sb-mute:#3d3d46; --sb-line:#cfc2aa; --sb-panel:#f1eadc; --sb-panel2:#ebe2d1; --sb-gold:#c8102e; --card-sh:0 1px 0 #fff inset,0 2px 8px rgba(70,50,25,.08); --hi:#fff; --glow:color-mix(in srgb,#c8102e 9%,transparent);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-b);margin:0;padding-block:0;
